<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タレントSNSデイリーレポート</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f6f7f9; color: #1a1a2e; padding: 20px; font-size: 13px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 2px; }
.sub { color: #667; font-size: 12px; margin-bottom: 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
select { padding: 6px 10px; border: 1px solid #d0d4dc; border-radius: 8px; background: #fff; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid #d0d4dc; background: #fff; cursor: pointer; font-size: 12px; user-select: none; }
.chip.on { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
.card { background: #fff; border-radius: 10px; padding: 10px 12px; border: 1px solid #e4e7ec; }
.card .lbl { font-size: 11px; color: #667; }
.card .val { font-size: 18px; font-weight: 700; margin-top: 2px; }
.card .dlt { font-size: 11px; margin-top: 2px; }
.up { color: #0a8a3c; } .down { color: #d4363e; } .flat { color: #99a; }
.section { background: #fff; border-radius: 12px; border: 1px solid #e4e7ec; padding: 14px; margin-bottom: 14px; }
.section h2 { font-size: 14px; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th { color: #667; font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; }
.tbl-wrap { overflow: auto; max-height: 480px; }
.pf { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; }
.pf-X { background: #eceef1; color: #333; }
.pf-Instagram { background: #fde7f1; color: #c1275f; }
.pf-TikTok { background: #e8e8ea; color: #111; }
.pf-YouTube { background: #fde3e3; color: #c00; }
.pf-Threads { background: #efe9e2; color: #6b4f2e; }
.chart-box { height: 320px; position: relative; }
.post { border-left: 3px solid #d0d4dc; padding: 6px 10px; margin-bottom: 8px; background: #fafbfc; border-radius: 0 8px 8px 0; }
.post .meta { font-size: 11px; color: #667; margin-bottom: 2px; }
.post .body { white-space: pre-wrap; font-size: 12.5px; }
.note { font-size: 11px; color: #889; margin-top: 6px; }
</style>
</head>
<body>
<h1>タレントSNSデイリーレポート</h1>
<div class="sub" id="sub"></div>
<div id="app"></div>

<template id="tpl">
<div class="controls">
<select id="selTalent"><option value="__ALL__">全タレント</option></select>
<div class="chips" id="pfChips"></div>
</div>
<div class="cards" id="cards"></div>
<div class="section">
<h2>フォロワー数 推移</h2>
<div class="chart-box"><canvas id="chart"></canvas></div>
<div class="note">タレント未選択時は各タレントの全SNS合計。選択時はプラットフォーム別。</div>
</div>
<div class="section">
<h2 id="tblTitle">最新スナップショット(前日比)</h2>
<div class="tbl-wrap"><table id="tbl"></table></div>
</div>
<div class="section">
<h2>新規投稿フィード</h2>
<div id="posts"></div>
</div>
</template>

<script>
// ===== DATA (自動生成: 毎朝の収集タスクがここを最新に置き換える) =====
const GENERATED_AT = "2026-11-07";
const DATA = (function(){
const T={a:"湯上響花",b:"小西詠斗",c:"景井ひな",d:"花山瑞貴",e:"水瀬紗彩耶",f:"七瀬恋彩",g:"まお",h:"皆藤空良",i:"せきぐちりさ",j:"坂田秀晃",k:"中本大賀",l:"宮本廉也",m:"永田聖一朗",n:"のぼりもえ",o:"SUMOMO"};
const P={X:"X",I:"Instagram",T:"TikTok",Y:"YouTube",H:"Threads"};
const S={
"2026-08-10":"aI,43000,1036,,0;lT,561000,,19400000,0;gX,78000,22000,,1;fH,140000,,,0;nH,20000,,,0;cT,10200000,,304200000,0;oI,21000,760,,0;aX,39000,25000,,0;fT,1500000,,19400000,0;gY,288000,1369,,0;bY,58500,62,,0;hI,6515,349,,0;eX,27000,3128,,1;fI,712000,780,,0;oY,2930,627,,0;eI,321000,775,,0;fX,23000,8179,,2;lH,1251,,,0;oT,3378,,207900,0;hX,1543,1593,,0;jT,332,,16100,0;nT,27800,,603300,0;dY,224000,315,,0;nY,24800,231,,0;mT,19000,,198700,0;aY,29900,105,,0;iI,425000,907,,0;bX,102000,14000,,1;gI,27000,267,,0;dH,36000,,,0;eY,45300,188,,0;aH,5699,,,1;aT,80200,,2000000,0;cH,55000,,,0;kI,29000,266,,0;lX,803,4139,,0;eT,944200,,33900000,0;oH,1153,,,0;dI,297000,885,,0;gT,165200,,3900000,0;cI,273000,727,,0;kT,10400,,299700,0;nX,4210,1683,,0;bI,222000,486,,0;dT,113500,,867900,0;iT,138400,,1500000,0;mI,57000,292,,0;mX,77000,3768,,0;iH,120000,,,0;bT,246600,,3900000,0;iX,32000,3969,,0;oX,2177,6007,,0;nI,148000,985,,0;cX,115000,3663,,0;kX,27000,2834,,1;lI,59000,653,,0;eH,40000,,,0;hT,23300,,753800,0;jI,3116,227,,0",

"2026-10-31":"bI,241000,504,,0;eY,45400,192,,0;kX,28000,3001,,1;cI,273000,744,,0;nY,24700,231,,0;iX,32000,3911,,0;oH,1293,,,0;iT,142300,,1500000,0;dH,36000,,,0;nT,27700,,611800,0;eX,28000,3202,,0;fH,140000,,,1;hT,23200,,755400,0;dY,224000,321,,0;nX,4154,1679,,0;gX,78000,22300,,1;nH,20000,,,0;bX,104000,14400,,1;aY,29900,107,,0;jT,385,,17300,0;aX,38000,25100,,3;dI,305000,905,,0;mI,55000,297,,0;aI,43000,1055,,0;bY,58300,62,,0;aT,80200,,2000000,0;gT,168500,,4100000,0;iH,120000,,,1;eT,965900,,35300000,0;mX,77000,3817,,1;cH,56000,,,0;lH,1585,,,0;aH,5777,,,0;cX,115000,3678,,0;mT,19000,,202500,0;oT,4061,,234700,0;eI,326000,823,,0;eH,49000,,,1;lI,74000,675,,0;lX,804,4151,,0;oY,3140,671,,0;lT,616900,,20800000,0;oX,2165,6026,,0;kI,30000,273,,0;oI,23000,843,,0;fT,1500000,,19600000,0;fX,26000,8270,,1;hX,1541,1609,,1;nI,148000,1016,,0;cT,10100000,,305300000,0;kT,10500,,302200,0;bT,247400,,3900000,0;dT,115600,,878000,0",
"2026-11-05":"kT,10500,,302600,0;nT,27700,,611900,0;lT,619300,,20900000,0;fX,26000,8272,,2;dT,115500,,878100,0;iH,123000,,,0;mX,77000,3820,,3;lI,76000,676,,1;fT,1500000,,19600000,0;bY,58300,62,,0;aH,5777,,,0;iI,420000,969,,1;bI,242000,505,,1;eT,965400,,35300000,0;fH,149000,,,0;eY,45400,192,,0;gI,28000,362,,4;dH,36000,,,0;iX,32000,3915,,4;aX,38000,25000,,0;lX,805,4151,,0;cI,273000,745,,1;oI,23000,847,,4;jI,134000,228,,9;cT,10100000,,305300000,0;oT,4105,,236300,0;eX,28000,3205,,3;kX,28000,3009,,8;gY,288000,1490,,14;eH,49000,,,0;nY,24700,231,,0;cH,57000,,,0;aY,29800,108,,1;hX,1541,1610,,1;gX,78000,22000,,0;oY,3160,673,,2;gT,168600,,4100000,0;jT,388,,17400,0;dY,224000,321,,0;lH,1600,,,0;eI,326000,825,,2;oH,1293,,,0;bT,247400,,3900000,0;fI,703000,793,,2;aI,43000,1055,,0;cX,115000,3680,,2;mT,18900,,202500,0;hI,6898,361,,1;nI,149000,1018,,2;iT,142300,,1500000,0;aT,80200,,2000000,0;oX,2169,6028,,2;bX,104000,14000,,0;nX,4148,1679,,0;dI,305000,906,,1;kI,30000,273,,0;mI,55000,297,,0;hT,23200,,755400,0;nH,20000,,,0",
"2026-11-07":"aT,80200,,2000000,0;aI,43000,1057,,2;aH,5778,,,0;aY,29800,108,,0;aX,38000,25000,,0;bT,247400,,3900000,0;bI,242000,505,,0;bY,58300,62,,0;bX,104000,14000,,1;cT,10100000,,305400000,0;cI,273000,745,,0;cH,56000,,,0;cX,115000,3680,,0;dT,115500,,878100,0;dI,305000,906,,0;dH,36000,,,0;dY,224000,321,,0;eT,965200,,35300000,0;eI,327000,827,,2;eH,49000,,,0;eY,45400,192,,0;eX,28000,3208,,1;fT,1500000,,19600000,0;fI,702000,794,,1;fH,140000,,,0;fX,26000,8274,,0;gT,168500,,4100000,0;gI,27000,363,,1;gY,287000,1493,,3;gX,78000,22000,,1;hT,23200,,755500,0;hI,6923,362,,1;hX,1537,1613,,1;iT,142300,,1500000,0;iI,419000,970,,1;iH,120000,,,0;iX,32000,3916,,0;jT,396,,17500,0;jI,134000,232,,4;kT,10500,,302700,0;kI,30000,273,,0;kX,28000,3015,,1;lT,620600,,21000000,0;lI,76000,677,,1;lH,1608,,,0;lX,805,4152,,0;mT,18900,,202500,0;mI,55000,297,,0;mX,77000,3820,,0;nT,27700,,612000,0;nI,148000,1019,,1;nH,20000,,,0;nY,24700,231,,0;nX,4146,1679,,0;oT,4131,,237300,0;oI,23000,850,,3;oH,1305,,,0;oY,3160,674,,1;oX,2168,6030,,1"
};
const NP={
"2026-11-07|oX":"periperaのCUコラボがブルベ夏の秋メイクにぴったり、という投稿(20時間前)",
"2026-11-07|eX":"お寿司の投稿(13時間前)",
"2026-11-07|bX":"オメガホーン第15話の放送告知(明日放送)",
"2026-11-07|kX":"ミュージカル「えぶりでいホスト」関連の投稿(9時間前)",
"2026-11-07|gX":"早稲田祭で筋肉がすごい人がいた、という投稿(16時間前)",
"2026-11-07|hX":"「楽しかったー!」の投稿(7時間前)",
"2026-10-31|bX":"FCお知らせ: Happy Halloween動画とプレゼント企画(はちのす会員)",
"2026-10-31|aX":"目がテン!洋館の科学の視聴御礼(Tver/Hulu配信)\nクラフト大理石の洋館解説\n洋館の大きな鏡は光を反射し広く見せる",
"2026-10-31|iH":"Happy Halloween(過去の写真)",
"2026-10-31|mX":"ハッピーハロウィン!稽古に励んでいます、髪をピンクに染めたが落ちた等",
"2026-10-31|kX":"ハッピーハロウィン🎃",
"2026-10-31|fH":"薫る花は凛と咲く 和栗薫子 ハロウィンコスプレ",
"2026-10-31|gX":"大学1年生のハロウィン動画",
"2026-10-31|eH":"1人で映り込みチャレンジしてみた(#fyp)",
"2026-10-31|fX":"和栗薫子 ハロウィンコスプレ",
"2026-10-31|hX":"堀田竜成バースデーイベント2部ゲスト出演"
};
const out=[];
for(const d in S){S[d].split(";").forEach(s=>{const a=s.split(",");const n=x=>x===""?null:Number(x);const o={d:d,t:T[a[0][0]],p:P[a[0][1]],f:n(a[1]),pc:n(a[2]),lk:n(a[3]),np:NP[d+"|"+a[0]]||"",npc:n(a[4])};out.push(o);});}
return out;
})();
// ================================================================
const PLATFORMS = ["X","Instagram","TikTok","YouTube","Threads"];
const fmt = n => n == null ? "–" : n >= 1e8 ? (n/1e8).toFixed(2)+"億" : n >= 1e4 ? (n/1e4).toFixed(n>=1e6?0:1)+"万" : n.toLocaleString();
const dfmt = n => n == null ? "" : (n>0?"+":"") + n.toLocaleString();
let rows = DATA.filter(x => x.d && x.t && x.p), chart = null;
const state = { talent: "__ALL__", pfs: [...PLATFORMS] };

function latestDates() {
const ds = [...new Set(rows.map(r => r.d))].sort();
return { latest: ds[ds.length-1], prev: ds[ds.length-2] || null, all: ds };
}

function render() {
const app = document.getElementById("app");
app.innerHTML = "";
app.appendChild(document.getElementById("tpl").content.cloneNode(true));
const { latest, all } = latestDates();
document.getElementById("sub").textContent = `レポート生成日: ${GENERATED_AT} ｜ 最終データ日: ${latest || "なし"} ｜ 記録日数: ${all.length}日 ｜ レコード: ${rows.length}件`;
const talents = [...new Set(rows.map(r => r.t))];
const sel = document.getElementById("selTalent");
talents.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
sel.value = state.talent;
sel.onchange = () => { state.talent = sel.value; draw(); };
const chips = document.getElementById("pfChips");
PLATFORMS.forEach(p => {
const c = document.createElement("div");
c.className = "chip" + (state.pfs.includes(p) ? " on" : "");
c.textContent = p;
c.onclick = () => {
state.pfs = state.pfs.includes(p) ? state.pfs.filter(x => x !== p) : [...state.pfs, p];
if (!state.pfs.length) state.pfs = [p];
c.classList.toggle("on"); draw();
};
chips.appendChild(c);
});
draw();
}

function filtered() {
return rows.filter(r => (state.talent === "__ALL__" || r.t === state.talent) && state.pfs.includes(r.p));
}

function draw() {
const { latest, prev } = latestDates();
const fr = filtered();
const latestRows = fr.filter(r => r.d === latest);
const prevMap = {};
fr.filter(r => r.d === prev).forEach(r => prevMap[r.t+"|"+r.p] = r);

const cards = document.getElementById("cards");
cards.innerHTML = "";
const totF = latestRows.reduce((s,r) => s + (r.f||0), 0);
const totPrev = prev ? latestRows.reduce((s,r) => { const pv = prevMap[r.t+"|"+r.p]; return s + (pv && pv.f != null ? pv.f : (r.f||0)); }, 0) : null;
const totNew = latestRows.reduce((s,r) => s + (r.npc||0), 0);
const mk = (lbl,val,dlt) => {
const d = document.createElement("div"); d.className = "card";
d.innerHTML = `<div class="lbl">${lbl}</div><div class="val">${val}</div>` + (dlt!==undefined?`<div class="dlt ${dlt>0?"up":dlt<0?"down":"flat"}">${dlt==null?"前日データなし":dfmt(dlt)+" (前日比)"}</div>`:"");
cards.appendChild(d);
};
mk("合計フォロワー数", fmt(totF), totPrev != null ? totF - totPrev : null);
mk("対象アカウント数", latestRows.length);
mk("本日の新規投稿数", totNew);
const best = latestRows.map(r => ({...r, dl: prevMap[r.t+"|"+r.p] ? (r.f||0)-(prevMap[r.t+"|"+r.p].f||0) : 0})).sort((a,b)=>b.dl-a.dl)[0];
if (best && best.dl > 0) mk("最大増加", `${best.t} ${best.p}`, best.dl);

const dates = [...new Set(fr.map(r => r.d))].sort();
let datasets = [];
const colors = ["#2456d6","#d4363e","#0a8a3c","#e08a00","#7b3fd4","#0aa0a8","#c1275f","#556","#8a6d3b","#333"];
if (state.talent === "__ALL__") {
const ts = [...new Set(fr.map(r => r.t))];
datasets = ts.map((t,i) => ({
label: t,
data: dates.map(d => { const rs = fr.filter(r => r.t===t && r.d===d); return rs.length ? rs.reduce((s,r)=>s+(r.f||0),0) : null; }),
borderColor: colors[i%colors.length], backgroundColor: colors[i%colors.length],
tension: .2, spanGaps: true, pointRadius: 3
}));
} else {
datasets = state.pfs.map((p,i) => ({
label: p,
data: dates.map(d => { const r = fr.find(x => x.t===state.talent && x.p===p && x.d===d); return r ? r.f : null; }),
borderColor: colors[i%colors.length], backgroundColor: colors[i%colors.length],
tension: .2, spanGaps: true, pointRadius: 3
}));
}
if (chart) chart.destroy();
chart = new Chart(document.getElementById("chart"), {
type: "line",
data: { labels: dates, datasets },
options: { responsive: true, maintainAspectRatio: false,
scales: { y: { ticks: { callback: v => fmt(v) } } },
plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } } }
});

const tbl = document.getElementById("tbl");
document.getElementById("tblTitle").textContent = `最新スナップショット ${latest || ""}(前日比)`;
const rowsHtml = latestRows
.sort((a,b) => a.t.localeCompare(b.t,"ja") || PLATFORMS.indexOf(a.p)-PLATFORMS.indexOf(b.p))
.map(r => {
const pv = prevMap[r.t+"|"+r.p];
const dl = pv && pv.f != null && r.f != null ? r.f - pv.f : null;
const dpc = pv && pv.pc != null && r.pc != null ? r.pc - pv.pc : null;
return `<tr><td>${r.t}</td><td><span class="pf pf-${r.p}">${r.p}</span></td>
<td>${r.f != null ? r.f.toLocaleString() : "–"}</td>
<td class="${dl>0?"up":dl<0?"down":"flat"}">${dl==null?"–":dfmt(dl)}</td>
<td>${r.pc != null ? r.pc.toLocaleString() : "–"}</td>
<td class="${dpc>0?"up":"flat"}">${dpc==null?"–":dfmt(dpc)}</td>
<td>${r.npc != null ? r.npc : "–"}</td></tr>`;
}).join("");
tbl.innerHTML = `<thead><tr><th>タレント</th><th>SNS</th><th>フォロワー</th><th>前日比</th><th>投稿累計</th><th>前日比</th><th>新規投稿</th></tr></thead><tbody>${rowsHtml}</tbody>`;

const postsDiv = document.getElementById("posts");
const withPosts = fr.filter(r => r.np && r.np.trim()).sort((a,b) => b.d.localeCompare(a.d)).slice(0, 40);
postsDiv.innerHTML = withPosts.length
? withPosts.map(r => `<div class="post"><div class="meta">${r.d} ｜ <b>${r.t}</b> <span class="pf pf-${r.p}">${r.p}</span></div><div class="body">${r.np.replace(/</g,"&lt;")}</div></div>`).join("")
: `<div class="note">表示できる新規投稿がありません。</div>`;
}
render();
</script>
</body>
</html>
