<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タレントSNSデイリーレポート</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f6f7f9; color: #1a1a2e; padding: 20px; font-size: 13px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 2px; }
.sub { color: #667; font-size: 12px; margin-bottom: 16px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
select { padding: 6px 10px; border: 1px solid #d0d4dc; border-radius: 8px; background: #fff; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid #d0d4dc; background: #fff; cursor: pointer; font-size: 12px; user-select: none; }
.chip.on { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 16px; }
.card { background: #fff; border-radius: 10px; padding: 10px 12px; border: 1px solid #e4e7ec; }
.card .lbl { font-size: 11px; color: #667; }
.card .val { font-size: 18px; font-weight: 700; margin-top: 2px; }
.card .dlt { font-size: 11px; margin-top: 2px; }
.up { color: #0a8a3c; } .down { color: #d4363e; } .flat { color: #99a; }
.section { background: #fff; border-radius: 12px; border: 1px solid #e4e7ec; padding: 14px; margin-bottom: 14px; }
.section h2 { font-size: 14px; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th { color: #667; font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; }
.tbl-wrap { overflow: auto; max-height: 480px; }
.pf { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; }
.pf-X { background: #eceef1; color: #333; }
.pf-Instagram { background: #fde7f1; color: #c1275f; }
.pf-TikTok { background: #e8e8ea; color: #111; }
.pf-YouTube { background: #fde3e3; color: #c00; }
.pf-Threads { background: #efe9e2; color: #6b4f2e; }
.chart-box { height: 320px; position: relative; }
.post { border-left: 3px solid #d0d4dc; padding: 6px 10px; margin-bottom: 8px; background: #fafbfc; border-radius: 0 8px 8px 0; }
.post .meta { font-size: 11px; color: #667; margin-bottom: 2px; }
.post .body { white-space: pre-wrap; font-size: 12.5px; }
.note { font-size: 11px; color: #889; margin-top: 6px; }
</style>
</head>
<body>
<h1>タレントSNSデイリーレポート</h1>
<div class="sub" id="sub"></div>
<div id="app"></div>

<template id="tpl">
<div class="controls">
<select id="selTalent"><option value="__ALL__">全タレント</option></select>
<div class="chips" id="pfChips"></div>
</div>
<div class="cards" id="cards"></div>
<div class="section">
<h2>フォロワー数 推移</h2>
<div class="chart-box"><canvas id="chart"></canvas></div>
<div class="note">タレント未選択時は各タレントの全SNS合計。選択時はプラットフォーム別。</div>
</div>
<div class="section">
<h2 id="tblTitle">最新スナップショット(前日比)</h2>
<div class="tbl-wrap"><table id="tbl"></table></div>
</div>
<div class="section">
<h2>新規投稿フィード</h2>
<div id="posts"></div>
</div>
</template>

const state = { talent: "__ALL__", pfs: [...PLATFORMS] };

function latestDates() {
const ds = [...new Set(rows.map(r => r.d))].sort();
return { latest: ds[ds.length-1], prev: ds[ds.length-2] || null, all: ds };
}

function render() {
const app = document.getElementById("app");
app.innerHTML = "";
app.appendChild(document.getElementById("tpl").content.cloneNode(true));
const { latest, all } = latestDates();
document.getElementById("sub").textContent = `レポート生成日: ${GENERATED_AT} ｜ 最終データ日: ${latest || "なし"} ｜ 記録日数: ${all.length}日 ｜ レコード: ${rows.length}件`;
const talents = [...new Set(rows.map(r => r.t))];
const sel = document.getElementById("selTalent");
talents.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
sel.value = state.talent;
sel.onchange = () => { state.talent = sel.value; draw(); };
const chips = document.getElementById("pfChips");
PLATFORMS.forEach(p => {
const c = document.createElement("div");
c.className = "chip" + (state.pfs.includes(p) ? " on" : "");
c.textContent = p;
c.onclick = () => {
state.pfs = state.pfs.includes(p) ? state.pfs.filter(x => x !== p) : [...state.pfs, p];
if (!state.pfs.length) state.pfs = [p];
c.classList.toggle("on"); draw();
};
chips.appendChild(c);
});
draw();
}

function filtered() {
return rows.filter(r => (state.talent === "__ALL__" || r.t === state.talent) && state.pfs.includes(r.p));
}

function draw() {
const { latest, prev } = latestDates();
const fr = filtered();
const latestRows = fr.filter(r => r.d === latest);
const prevMap = {};
fr.filter(r => r.d === prev).forEach(r => prevMap[r.t+"|"+r.p] = r);

const cards = document.getElementById("cards");
cards.innerHTML = "";
const totF = latestRows.reduce((s,r) => s + (r.f||0), 0);
const totPrev = prev ? latestRows.reduce((s,r) => { const pv = prevMap[r.t+"|"+r.p]; return s + (pv && pv.f != null ? pv.f : (r.f||0)); }, 0) : null;
const totNew = latestRows.reduce((s,r) => s + (r.npc||0), 0);
const mk = (lbl,val,dlt) => {
const d = document.createElement("div"); d.className = "card";
d.innerHTML = `<div class="lbl">${lbl}</div><div class="val">${val}</div>` + (dlt!==undefined?`<div class="dlt ${dlt>0?"up":dlt<0?"down":"flat"}">${dlt==null?"前日データなし":dfmt(dlt)+" (前日比)"}</div>`:"");
cards.appendChild(d);
};
mk("合計フォロワー数", fmt(totF), totPrev != null ? totF - totPrev : null);
mk("対象アカウント数", latestRows.length);
mk("本日の新規投稿数", totNew);
const best = latestRows.map(r => ({...r, dl: prevMap[r.t+"|"+r.p] ? (r.f||0)-(prevMap[r.t+"|"+r.p].f||0) : 0})).sort((a,b)=>b.dl-a.dl)[0];
if (best && best.dl > 0) mk("最大増加", `${best.t} ${best.p}`, best.dl);

const dates = [...new Set(fr.map(r => r.d))].sort();
let datasets = [];
const colors = ["#2456d6","#d4363e","#0a8a3c","#e08a00","#7b3fd4","#0aa0a8","#c1275f","#556","#8a6d3b","#333"];
if (state.talent === "__ALL__") {
const ts = [...new Set(fr.map(r => r.t))];
datasets = ts.map((t,i) => ({
label: t,
data: dates.map(d => { const rs = fr.filter(r => r.t===t && r.d===d); return rs.length ? rs.reduce((s,r)=>s+(r.f||0),0) : null; }),
borderColor: colors[i%colors.length], backgroundColor: colors[i%colors.length],
tension: .2, spanGaps: true, pointRadius: 3
}));
} else {
datasets = state.pfs.map((p,i) => ({
label: p,
data: dates.map(d => { const r = fr.find(x => x.t===state.talent && x.p===p && x.d===d); return r ? r.f : null; }),
borderColor: colors[i%colors.length], backgroundColor: colors[i%colors.length],
tension: .2, spanGaps: true, pointRadius: 3
}));
}
if (chart) chart.destroy();
chart = new Chart(document.getElementById("chart"), {
type: "line",
data: { labels: dates, datasets },
options: { responsive: true, maintainAspectRatio: false,
scales: { y: { ticks: { callback: v => fmt(v) } } },
plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } } }
});

const tbl = document.getElementById("tbl");
document.getElementById("tblTitle").textContent = `最新スナップショット ${latest || ""}(前日比)`;
const rowsHtml = latestRows
.sort((a,b) => a.t.localeCompare(b.t,"ja") || PLATFORMS.indexOf(a.p)-PLATFORMS.indexOf(b.p))
.map(r => {
const pv = prevMap[r.t+"|"+r.p];
const dl = pv && pv.f != null && r.f != null ? r.f - pv.f : null;
const dpc = pv && pv.pc != null && r.pc != null ? r.pc - pv.pc : null;
return `<tr><td>${r.t}</td><td><span class="pf pf-${r.p}">${r.p}</span></td>
<td>${r.f != null ? r.f.toLocaleString() : "–"}</td>
<td class="${dl>0?"up":dl<0?"down":"flat"}">${dl==null?"–":dfmt(dl)}</td>
<td>${r.pc != null ? r.pc.toLocaleString() : "–"}</td>
<td class="${dpc>0?"up":"flat"}">${dpc==null?"–":dfmt(dpc)}</td>
<td>${r.npc != null ? r.npc : "–"}</td></tr>`;
}).join("");
tbl.innerHTML = `<thead><tr><th>タレント</th><th>SNS</th><th>フォロワー</th><th>前日比</th><th>投稿累計</th><th>前日比</th><th>新規投稿</th></tr></thead><tbody>${rowsHtml}</tbody>`;

const postsDiv = document.getElementById("posts");
const withPosts = fr.filter(r => r.np && r.np.trim()).sort((a,b) => b.d.localeCompare(a.d)).slice(0, 40);
postsDiv.innerHTML = withPosts.length
? withPosts.map(r => `<div class="post"><div class="meta">${r.d} ｜ <b>${r.t}</b> <span class="pf pf-${r.p}">${r.p}</span></div><div class="body">${r.np.replace(/</g,"&lt;")}</div></div>`).join("")
: `<div class="note">表示できる新規投稿がありません。</div>`;
}
render();
</script>
</body>
</html>
